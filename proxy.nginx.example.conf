# Referência para um proxy controlado pelo operador; não execute sem revisar domínio/TLS.
# Backend: HOST=127.0.0.1, PORT=3000, TRUST_PROXY=1,
# TRUSTED_PROXY_IPS=127.0.0.1/32,::1/128 e PUBLIC_BASE_URL com HTTPS real.
# Não copie esta lista para o proxy do Render: a topologia é diferente.
server {
    listen 443 ssl;
    server_name SEU_DOMINIO;
    ssl_certificate /CAMINHO_DO_CERTIFICADO;
    ssl_certificate_key /CAMINHO_DA_CHAVE_PRIVADA;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 13m;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        # Substitui o valor enviado pelo cliente; não concatena headers arbitrários.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
